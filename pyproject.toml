[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikerz-qa"
version = "1.0.0"
description = "Test-account inventory, daily health checks and reporting for Spikerz QA"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spikerz-qa = "spikerz_qa.cli:main"

[tool.setuptools.packages.find]
include = ["spikerz_qa*"]
